# Cloudflare Worker that serves the static site in /public
# and handles the /api/* routes in src/worker.js.
name = "herbert-resume"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Keep variables added in the Cloudflare dashboard when deploying from GitHub
# (otherwise every deploy would remove them).
keep_vars = true

# Workers Logs: lets you see requests and errors in the Cloudflare dashboard
# (herbert-resume -> Observability). Free at this site's traffic.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker handles /api/* and the home page (to fill in link-preview tags);
# everything else is served straight from /public.
run_worker_first = ["/api/*", "/", "/index.html"]

# Form spam limit: at most 5 submissions per minute per visitor
# (welcome pop-up and contact form).
[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
